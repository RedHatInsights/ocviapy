name: 🕵️ Test suite

on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main

permissions: {}

jobs:
  pre-commit:
    name: pre-commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        show-progress: false
    - name: Setup python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.x"
    - name: Install the latest version of ruff
      uses: astral-sh/ruff-action@0ce1b0bf8b818ef400413f810f8a11cdbda0034b # v4.0.0
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  platform:
    name: 💻 Platform-${{ matrix.os }}
    needs: [ pre-commit ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        show-progress: false
    - name: Setup python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.x"
    - name: Development setup on ${{ matrix.os }}
      run: |
        python -m pip install pip --upgrade
        pip install -e .
        python -c "from ocviapy import get_associated_pods, get_routes, get_json"

  package:
    name: ⚙️ Build and Verify Package
    runs-on: ubuntu-latest
    needs: [ pre-commit ]
    permissions:
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with:
        show-progress: false
    - name: Setup python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: "3.x"
    - name: Twine checks
      run: |
        python -m pip install pip twine build --upgrade
        python -m build
        ls -l dist
        python -m twine check dist/*
